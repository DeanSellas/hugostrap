<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
<meta name="keywords" content="{{ site.Params.keywords }}">
<meta name="description" content="{{ site.Params.description }}">
<meta name="title" content='{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}' />
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Facebook Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Site.BaseURL }}">
<meta property="og:title" content="{{ .Site.Title }} - {{ .Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:image" content="{{ .Site.BaseURL }}images/thumb.webp" />

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:url" content="{{ .Site.BaseURL }}" />
<meta property="twitter:title" content="{{ .Site.Title }} - {{ .Title }}" />
<meta property="twitter:description" content="{{ site.Params.description }}" />
<meta property="twitter:image" content="{{ .Site.BaseURL }}images/thumb.webp" />


{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}
{{ partialCached "head/fonts.html" . }}
